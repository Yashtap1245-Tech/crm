<nav class="pagination-row" aria-label="Pagination"><span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{{ params }}&page={{ page.previous_page_number }}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{{ params }}&page={{ page.next_page_number }}">Next</a>{% endif %}</div></nav>
